name: Auto Deploy Voice Agent to Google Cloud

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**' # Only triggers when files inside backend/ are changed

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Google Cloud VM via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.GCP_VM_IP }}
          username: ${{ secrets.GCP_VM_USER }}
          key: ${{ secrets.GCP_SSH_KEY }}
          script: |
            cd ~/ria-agent/backend
            git pull origin main
            source .venv/bin/activate
            pip install -r requirements.txt
            sudo systemctl restart ria-agent
